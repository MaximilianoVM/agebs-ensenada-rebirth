[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agebs-ensenada"
version = "0.1.0"
description = "Análisis reproducible de Transformación Socioespacial (ITSE) en Ensenada, B.C."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Maximiliano Vaca Montejano", email = "maximiliano.vaca@uabc.edu.mx" }
]
dependencies = [
    "pandas>=2.1.0",
    "geopandas>=0.14.0",
    "scikit-learn>=1.3.0",
    "inegipy>=2.0.0",
    "typer[all]>=0.9.0",
    "rich>=13.5.0",
    "streamlit>=1.28.0",
]

[project.scripts]
agebs = "app.cli:app"

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]